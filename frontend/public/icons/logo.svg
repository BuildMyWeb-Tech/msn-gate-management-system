<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(4,4)">
    <rect width="44" height="44" rx="10" fill="url(#shield-grad)"/>
    <!-- Shield shape -->
    <path d="M22 6 L36 11 L36 24 Q36 35 22 40 Q8 35 8 24 L8 11 Z"
          fill="#000" opacity="0.85"/>
    <!-- Checkmark -->
    <polyline points="14,23 20,30 30,17"
              fill="none" stroke="#f59e0b"
              stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MSN text -->
  <text x="56" y="28"
        font-family="'Inter','Segoe UI',sans-serif"
        font-weight="900" font-size="22"
        fill="#f59e0b" letter-spacing="-0.5">MSN</text>

  <!-- INFOTEC text -->
  <text x="57" y="44"
        font-family="'Inter','Segoe UI',sans-serif"
        font-weight="600" font-size="11"
        fill="#94a3b8" letter-spacing="2">INFOTEC</text>

  <!-- Divider line -->
  <line x1="118" y1="14" x2="118" y2="46"
        stroke="#2a3347" stroke-width="1.5"/>

  <!-- Gate Management text -->
  <text x="126" y="27"
        font-family="'Inter','Segoe UI',sans-serif"
        font-weight="700" font-size="12"
        fill="#f1f5f9">Gate</text>
  <text x="126" y="42"
        font-family="'Inter','Segoe UI',sans-serif"
        font-weight="400" font-size="10"
        fill="#64748b">Management</text>
</svg>
